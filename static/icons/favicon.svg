<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B23"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#F5C518" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(245, 197, 24, 0.25)" stroke-width="8"/>

  <!-- Glowing accent circle -->
  <circle cx="256" cy="256" r="180" fill="url(#goldGrad)" opacity="0.08" filter="blur(40px)"/>

  <!-- Clapperboard / Movie Camera Modern Emblem -->
  <g filter="url(#shadow)">
    <!-- Base clapper body -->
    <rect x="116" y="210" width="280" height="190" rx="28" fill="#14151C" stroke="url(#goldGrad)" stroke-width="10"/>

    <!-- Clapper top stick (slanted) -->
    <g transform="rotate(-12 116 200)">
      <rect x="100" y="148" width="312" height="58" rx="16" fill="url(#goldGrad)"/>
      <!-- Diagonal stripes on top stick -->
      <polygon points="140,148 175,148 145,206 110,206" fill="#0A0B0E"/>
      <polygon points="210,148 245,148 215,206 180,206" fill="#0A0B0E"/>
      <polygon points="280,148 315,148 285,206 250,206" fill="#0A0B0E"/>
      <polygon points="350,148 385,148 355,206 320,206" fill="#0A0B0E"/>
    </g>

    <!-- Play triangle button in center of clapper body -->
    <polygon points="236,270 296,305 236,340" fill="url(#goldGrad)"/>

    <!-- Small Star rating badge -->
    <circle cx="340" cy="255" r="16" fill="url(#goldGrad)"/>
    <polygon points="340,244 344,253 353,254 347,260 348,269 340,264 332,269 333,260 327,254 336,253" fill="#0A0B0E"/>
  </g>
</svg>